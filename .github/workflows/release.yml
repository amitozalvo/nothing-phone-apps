name: Build & Release APK

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      NOTHINGSUITE_STORE_PASSWORD: ${{ secrets.NOTHINGSUITE_STORE_PASSWORD }}
      NOTHINGSUITE_KEY_PASSWORD: ${{ secrets.NOTHINGSUITE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Consistent signing across releases so updates install in place.
      # Without the secrets, the build falls back to a debug key (fine for
      # testing, but users would have to uninstall between such releases).
      - name: Restore signing keystore
        if: env.KEYSTORE_B64 != ''
        run: |
          mkdir -p signing
          echo "$KEYSTORE_B64" | base64 -d > signing/release.keystore

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - name: Prepare release metadata
        id: meta
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk "glimpse-v$VERSION.apk"
          if [ -z "$KEYSTORE_B64" ]; then
            echo "signing_note=⚠️ Built without the release keystore (debug-signed). Installing over a properly signed build requires uninstalling first." >> "$GITHUB_OUTPUT"
          else
            echo "signing_note=Signed with the Glimpse release key — installs over previous releases." >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: Glimpse v${{ steps.meta.outputs.version }}
          body: |
            ${{ steps.meta.outputs.signing_note }}

            Download `glimpse-v${{ steps.meta.outputs.version }}.apk` below and open it on your Nothing Phone (3). See the README for setup steps.
          generate_release_notes: true
          files: glimpse-v${{ steps.meta.outputs.version }}.apk
